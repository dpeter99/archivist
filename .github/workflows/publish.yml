name: Build and Publish Core Package

on:
  push:
    branches:
      - v2
      - ci-cd
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  version-check:
    name: Check Version Change
    runs-on: ubuntu-latest
    # Only run version check on branch pushes, not tags
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      version_changed: ${{ steps.version-check.outputs.changed }}
      version: ${{ steps.version-check.outputs.version }}
      commit_hash: ${{ steps.version-check.outputs.commit_hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need at least 2 commits to compare

      - name: Check version change
        id: version-check
        uses: EndBug/version-check@v2
        with:
          file-name: packages/archavist/package.json
          diff-search: true

      - name: Log version check result
        run: |
          echo "Version changed: ${{ steps.version-check.outputs.changed }}"
          echo "Version: ${{ steps.version-check.outputs.version }}"
          echo "Commit hash: ${{ steps.version-check.outputs.commit_hash }}"
          echo "Version type: ${{ steps.version-check.outputs.type }}"
  
  
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dpeter99'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build core package
        run: pnpm --filter @dpeter99/archavist build

      - name: Publish to GitHub Packages
        working-directory: packages/archavist
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
